# git-cliff is the one SemVer brain now — strict even before 1.0, no branch archaeology needed 🧠🔥

[changelog]
header = """
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}

{% for commit in commits %}\
- {{ commit.message | upper_first | trim }} 🔥
{% endfor %}
{% endfor %}\
"""
footer = """
"""
trim = true
# Keep the latest tagged baseline visible when every unreleased commit is skipped.
# `--bumped-version` can then return the current version as a clean no-op instead of inventing 0.1.0 🔒🔥
render_always = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-((?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?$'
use_branch_tags = false
topo_order = false
sort_commits = "oldest"
commit_parsers = [
  { message = '^[a-z]+(?:\([^)]*\))?!:', group = "breaking glow-ups 💥🔥" },
  { message = '^feat(?:\([^)]*\))?:', group = "added — fresh rizz ✨🔥" },
  { message = '^fix(?:\([^)]*\))?:', group = "fixed — Ls eliminated 🐛🔥" },
  { message = '^perf(?:\([^)]*\))?:', group = "performance — faster vibes ⚡🔥" },
  { message = '^revert(?:\([^)]*\))?:', group = "reverted — timeline repaired ⏪🔥" },
  { message = '^chore\(deps\):', group = "dependencies — fresh nuggies 🤖🔥" },
  { message = '.*', skip = true },
]

[bump]
features_always_bump_minor = true
breaking_always_bump_major = true
