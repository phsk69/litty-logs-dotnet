# rolling release PR brain — one branch, immutable tags, zero branch archaeology 🧠🔥
name: release-pr

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: forced SemVer move when auto is not the vibe 🔥
        required: true
        default: auto
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
          - promote

concurrency:
  group: release-pr
  cancel-in-progress: false

jobs:
  signing-policy:
    runs-on: linux
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: verify the signed main graph before arming release credentials 🔏🔥
        run: |
          set -euo pipefail
          cutoff=89ce86f06910c4b8f6f7254afa11651f85385b62
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$cutoff" "$GITHUB_SHA"
          git config gpg.format ssh
          git config gpg.ssh.program ssh-keygen
          git config gpg.ssh.allowedSignersFile "$GITHUB_WORKSPACE/.forgejo/signing/allowed_signers"
          git config gpg.ssh.revocationFile "$GITHUB_WORKSPACE/.forgejo/signing/revoked_signers"
          commits=$(git rev-list --reverse "$cutoff..$GITHUB_SHA")
          while read -r commit; do
            [ -n "$commit" ] || continue
            git verify-commit "$commit"
          done <<< "$commits"

  roll-release-pr:
    needs: signing-policy
    runs-on: linux
    steps:
      - name: make sure the release PAT is real rizz 🔒🔥
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          AUTOMATION_SSH_SIGNING_KEY: ${{ secrets.AUTOMATION_SSH_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "bruh RELEASE_TOKEN is missing — action-token pushes cannot wake the downstream release reliably 💀🔥"
            exit 1
          fi
          if [ -z "$AUTOMATION_SSH_SIGNING_KEY" ]; then
            echo "bruh AUTOMATION_SSH_SIGNING_KEY is missing — unsigned release commits and tags are banned 💀🔥"
            exit 1
          fi

      - name: yoink the whole graph with the release PAT 📥🔥
        uses: https://data.forgejo.org/actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: arm the dedicated SSH release signer 🔏🔥
        env:
          AUTOMATION_SSH_SIGNING_KEY: ${{ secrets.AUTOMATION_SSH_SIGNING_KEY }}
        run: |
          set -euo pipefail
          signing_dir="${RUNNER_TEMP:-/tmp}/litty-release-signing"
          signing_key="${signing_dir}/key"
          install -d -m 700 "$signing_dir"
          printf '%s\n' "$AUTOMATION_SSH_SIGNING_KEY" > "$signing_key"
          chmod 600 "$signing_key"
          ssh-keygen -y -f "$signing_key" > "${signing_key}.pub"
          actual_fingerprint=$(ssh-keygen -lf "${signing_key}.pub" | awk '{print $2}')
          expected_fingerprint='SHA256:glcAr+2qy78C126hwWy7It4ND94VzwatrJkb+eeBByg'
          if [ "$actual_fingerprint" != "$expected_fingerprint" ]; then
            echo "bruh release signing key fingerprint ${actual_fingerprint} is not the trusted key 💀🔥"
            exit 1
          fi
          git config user.name "litty logs release bot 🔥"
          git config user.email "litty-logs-release@noreply.git.ssy.dk"
          git config gpg.format ssh
          git config gpg.ssh.program ssh-keygen
          git config user.signingkey "$signing_key"
          git config gpg.ssh.allowedSignersFile "$GITHUB_WORKSPACE/.forgejo/signing/allowed_signers"
          git config gpg.ssh.revocationFile "$GITHUB_WORKSPACE/.forgejo/signing/revoked_signers"
          git config commit.gpgsign true
          git config tag.gpgSign true
          echo "release signer fingerprint verified and armed 🔏🔥"

      - name: grab the pinned git-cliff 🧰🔥
        run: bash scripts/install-git-cliff.sh

      - name: calculate the next move or tag the merged release commit 🧠🔥
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --tags origin
          git fetch --force origin main:refs/remotes/origin/main
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$GITHUB_SHA" != "$(git rev-parse origin/main)" ]; then
            echo "bruh manual release math must start at the current main tip, side-ref dispatch is not the vibe 💀🔥"
            exit 1
          fi
          current=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?$'
          if [[ ! "$current" =~ $semver ]]; then
            echo "bruh Directory.Build.props has non-SemVer '${current}', release math refuses that L 💀🔥"
            exit 1
          fi

          tag_outcome=$(bash scripts/release-tag-current.sh "$EVENT_NAME" "$current" "$GITHUB_SHA")
          if [ "$tag_outcome" = "tagged" ]; then
            echo "outcome=tagged" >> "$GITHUB_OUTPUT"
            echo "current=${current}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          bump="${REQUESTED_BUMP:-auto}"
          next=""
          if [ "$bump" = "auto" ]; then
            if [[ "$current" == *-* ]]; then
              echo "RC freeze is active at ${current}; dispatch promote when stable is verified, no rc.2 loop gets spawned 🔒🔥"
              echo "outcome=none" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            next_raw=$(git-cliff --config cliff.toml --bumped-version --unreleased)
            next="${next_raw#v}"
          elif [ "$bump" = "promote" ]; then
            if [[ "$current" != *-* ]]; then
              echo "bruh promote only works from a prerelease like 1.0.0-rc.1 💀🔥"
              exit 1
            fi
            next="${current%%-*}"
          else
            base="${current%%-*}"
            IFS='.' read -r major minor patch <<< "$base"
            case "$bump" in
              patch) next="${major}.${minor}.$((patch + 1))" ;;
              minor) next="${major}.$((minor + 1)).0" ;;
              major) next="$((major + 1)).0.0" ;;
              *) echo "bruh bump '${bump}' is not auto, patch, minor, major, or promote 💀🔥"; exit 1 ;;
            esac
          fi

          if [ -z "$next" ] || [ "$next" = "$current" ]; then
            echo "no releasable commits are cooking, so no empty PR gets spawned 🔍🔥"
            echo "outcome=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$next" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "bruh calculated version '${next}' is not stable strict SemVer 💀🔥"
            exit 1
          fi
          if git rev-parse "refs/tags/v${next}" >/dev/null 2>&1; then
            echo "bruh v${next} already exists — versions only move forward and tags stay immutable 💀🔥"
            exit 1
          fi

          echo "outcome=pr" >> "$GITHUB_OUTPUT"
          echo "current=${current}" >> "$GITHUB_OUTPUT"
          echo "next=${next}" >> "$GITHUB_OUTPUT"
          echo "${current} -> ${next} is the next release vibe 🔥"

      - name: cook the version and release notes 📜🔥
        if: steps.release.outputs.outcome == 'pr'
        env:
          CURRENT: ${{ steps.release.outputs.current }}
          NEXT: ${{ steps.release.outputs.next }}
        run: |
          set -euo pipefail
          bash scripts/release-notes.sh preview "$NEXT" > "${RUNNER_TEMP:?}/litty-release-notes.md"
          sed -i "s|<Version>${CURRENT}</Version>|<Version>${NEXT}</Version>|" Directory.Build.props
          git fetch origin refs/heads/release-pr:refs/remotes/origin/release-pr || true
          git checkout -B release-pr "$GITHUB_SHA"
          git add Directory.Build.props
          git commit --gpg-sign -m "chore(release): v${NEXT} 🔥"
          git verify-commit HEAD
          git push --force-with-lease origin release-pr

      - name: open or refresh the one rolling Release PR 🤖🔥
        if: steps.release.outputs.outcome == 'pr'
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          NEXT: ${{ steps.release.outputs.next }}
        run: |
          set -euo pipefail
          api="${FORGEJO_API_URL:-${GITHUB_SERVER_URL}/api/v1}"
          notes="${RUNNER_TEMP:?}/litty-release-notes.md"
          open_prs="${RUNNER_TEMP:-/tmp}/litty-open-prs.json"
          payload="${RUNNER_TEMP:-/tmp}/litty-release-pr.json"

          curl --fail --silent --show-error \
            -H "Authorization: token ${RELEASE_TOKEN}" \
            "${api}/repos/${GITHUB_REPOSITORY}/pulls?state=open&limit=50" \
            --output "$open_prs"
          number=$(jq -r '.[] | select(.head.ref == "release-pr" and .base.ref == "main") | .number' "$open_prs" | head -n 1)

          if [ -n "$number" ]; then
            bash scripts/release-pr-payload.sh update "$NEXT" "$notes" > "$payload"
            curl --fail --silent --show-error --request PATCH \
              -H "Authorization: token ${RELEASE_TOKEN}" \
              -H "Content-Type: application/json" \
              --data-binary "@${payload}" \
              "${api}/repos/${GITHUB_REPOSITORY}/pulls/${number}" > /dev/null
            echo "Release PR #${number} refreshed to v${NEXT} bestie 🔄🔥"
          else
            bash scripts/release-pr-payload.sh create "$NEXT" "$notes" > "$payload"
            curl --fail --silent --show-error --request POST \
              -H "Authorization: token ${RELEASE_TOKEN}" \
              -H "Content-Type: application/json" \
              --data-binary "@${payload}" \
              "${api}/repos/${GITHUB_REPOSITORY}/pulls" > /dev/null
            echo "Release PR for v${NEXT} spawned and ready for the green button 🤖🔥"
          fi
