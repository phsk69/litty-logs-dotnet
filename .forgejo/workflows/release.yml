# release pipeline — tag goes brrr and packages hit nuget.org 🚀
name: release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: linux
    steps:
      - name: yoink the code 📥
        uses: https://data.forgejo.org/actions/checkout@v7
        with:
          fetch-depth: 0

      - name: make sure the tag grew from the main trunk 🌳🔒
        run: |
          git fetch --no-tags origin main
          main_commit=$(git rev-parse FETCH_HEAD)
          tag_commit=$(git rev-list -n 1 "${GITHUB_REF_NAME}")
          if ! git merge-base --is-ancestor "$tag_commit" "$main_commit"; then
            echo "bruh ${GITHUB_REF_NAME} is not on main — rogue tags do not ship nuggies 💀"
            exit 1
          fi
          echo "${GITHUB_REF_NAME} is rooted in main, trunk vibes confirmed 🌳🔥"

      - name: figure out the version from the tag 🏷️
        id: version
        run: |
          # strip the v prefix from the tag — v1.2.3 -> 1.2.3
          VERSION="${GITHUB_REF_NAME#v}"
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?$'
          if [[ ! "$VERSION" =~ $semver ]]; then
            echo "bruh ${GITHUB_REF_NAME} is not strict SemVer, no nuggies for rogue tags 💀🔥"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          # auto-detect pre-release — if version has a dash its not the final form 🚨
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "version is ${VERSION} (pre-release) — test drop incoming 🧪"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "version is ${VERSION} lets gooo 🔥"
          fi

      - name: sanity check — make sure tag matches Directory.Build.props 🧐
        run: |
          props_version=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)
          if [ "$props_version" != "${{ steps.version.outputs.version }}" ]; then
            echo "bruh the tag says ${{ steps.version.outputs.version }} but Directory.Build.props says ${props_version} thats not it 💀"
            exit 1
          fi
          echo "version vibes match — ${props_version} 🔥"

      - name: litty build in release mode 🏗️🔥
        run: dotnet run --project src/LittyLogs.Tool -- build --configuration Release

      - name: litty test one more time for the culture 🧪🔥
        run: dotnet run --project src/LittyLogs.Tool -- test --configuration Release --no-build

      - name: pack all the nuggies 📦
        run: dotnet pack --configuration Release --no-build --output ./nupkgs

      - name: flex what we packed 💅
        run: ls -la ./nupkgs/

      - name: push to nuget.org — the besties need these packages 🚀
        run: |
          for pkg in ./nupkgs/*.nupkg; do
            echo "pushing ${pkg} to nuget.org no cap 📤"
            dotnet nuget push "$pkg" \
              --api-key "${{ secrets.NUGET_API_KEY }}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      - name: extract changelog section for this version 📜
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # extract everything between this version header and the next version header (or EOF)
          NOTES=$(awk "/^## \[${VERSION}\]/{found=1; next} /^## \[/{if(found) exit} found{print}" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="v${VERSION} dropped no cap — check the commits for the full vibe 🔥"
          fi
          {
            echo "notes<<CHANGELOG_EOF"
            echo "$NOTES"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: create or reuse forgejo release 🏠🔥
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: ${{ steps.changelog.outputs.notes }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          NOTES="$RELEASE_NOTES"
          PRERELEASE="${{ steps.version.outputs.prerelease }}"
          API_URL="${GITHUB_SERVER_URL}/api/v1"
          REPO="${GITHUB_REPOSITORY}"
          # check if release already exists (retryable — no duplicate Ls)
          HTTP_CODE=$(curl -s -o /tmp/release.json -w "%{http_code}" \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            "${API_URL}/repos/${REPO}/releases/tags/${TAG}")
          if [ "$HTTP_CODE" = "200" ]; then
            RELEASE_ID=$(jq -r '.id' /tmp/release.json)
            echo "forgejo release already exists (id ${RELEASE_ID}) — skipping creation 💅"
          else
            echo "creating forgejo release 🏗️"
            RELEASE_ID=$(curl -s -X POST \
              -H "Authorization: token ${GITHUB_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"tag_name\": \"${TAG}\", \"name\": \"v${VERSION} — new drop 🔥\", \"body\": $(echo "$NOTES" | jq -Rs .), \"prerelease\": ${PRERELEASE}}" \
              "${API_URL}/repos/${REPO}/releases" | jq -r '.id')
            if [ "$RELEASE_ID" = "null" ] || [ -z "$RELEASE_ID" ]; then
              echo "bruh forgejo release creation failed 💀"
              exit 1
            fi
            echo "forgejo release created (id ${RELEASE_ID}) 🔥"
          fi
          # re-fetch release to get fresh asset list
          curl -s -o /tmp/release.json \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            "${API_URL}/repos/${REPO}/releases/${RELEASE_ID}"
          # upload assets — delete existing dupes first so retries dont brick
          for pkg in ./nupkgs/*.nupkg; do
            filename=$(basename "$pkg")
            ASSET_ID=$(jq -r ".assets[] | select(.name==\"${filename}\") | .id // empty" /tmp/release.json 2>/dev/null)
            if [ -n "$ASSET_ID" ]; then
              echo "deleting old ${filename} asset before re-upload 🗑️"
              curl -s -X DELETE \
                -H "Authorization: token ${GITHUB_TOKEN}" \
                "${API_URL}/repos/${REPO}/releases/${RELEASE_ID}/assets/${ASSET_ID}" > /dev/null
            fi
            echo "uploading ${filename} 📤"
            curl -s -X POST \
              -H "Authorization: token ${GITHUB_TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@${pkg}" \
              "${API_URL}/repos/${REPO}/releases/${RELEASE_ID}/assets?name=${filename}" > /dev/null
          done
          echo "forgejo release is bussin 🔥"

      - name: create github release on the mirror 🪞
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          RELEASE_NOTES: ${{ steps.changelog.outputs.notes }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          PRERELEASE_FLAG=""
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          # forgejo push mirror syncs to github automatically but might take a sec 🪞
          echo "waiting for forgejo mirror to sync the tag to github..."
          for i in $(seq 1 30); do
            if gh api repos/phsk69/litty-logs-dotnet/git/refs/tags/"${TAG}" --silent 2>/dev/null; then
              echo "tag ${TAG} found on github lets gooo 🔥"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "bruh tag ${TAG} still not on github after 30 tries thats not it 💀"
              exit 1
            fi
            echo "mirror aint synced yet, waiting 2s... (attempt ${i}/30)"
            sleep 2
          done
          # create or reuse github release (retryable — re-run all day no Ls 🔄)
          if gh release view "${TAG}" --repo "phsk69/litty-logs-dotnet" > /dev/null 2>&1; then
            echo "github release already exists — uploading fresh assets 💅"
            gh release upload "${TAG}" \
              --repo "phsk69/litty-logs-dotnet" \
              --clobber \
              ./nupkgs/*.nupkg
          else
            gh release create "${TAG}" \
              --repo "phsk69/litty-logs-dotnet" \
              --title "v${VERSION} — new drop 🔥" \
              --notes "$RELEASE_NOTES" \
              $PRERELEASE_FLAG \
              ./nupkgs/*.nupkg
          fi
          echo "github release is bussin — packages shipped everywhere 🔥🚀"
