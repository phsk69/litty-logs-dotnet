# ci pipeline — makes sure nothing is bricked before we merge no cap 🔥
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

jobs:
  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: linux
    steps:
      - name: check the squash title drives SemVer cleanly 🧠🔥
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|revert|chore|docs|ci|test|style|build|refactor)(\([a-zA-Z0-9._/-]+\))?(!)?: .+ 🔥$'
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "bruh PR title '${PR_TITLE}' is not conventional + 🔥, so release math cannot cook safely 💀🔥"
            echo "use vibes like feat(webhooks)!: ship the glow-up 🔥 or fix: eliminate the L 🔥"
            exit 1
          fi
          echo "PR title is SemVer-readable and fully fire 🔥"

  signing-policy:
    runs-on: linux
    steps:
      - name: yoink the full signed graph 📥🔏🔥
        uses: https://data.forgejo.org/actions/checkout@v7
        with:
          fetch-depth: 0

      - name: verify every post-rollout commit is trusted 🔏🔥
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          cutoff=89ce86f06910c4b8f6f7254afa11651f85385b62
          head_sha="${PR_HEAD_SHA:-$GITHUB_SHA}"
          allowed_signers="$GITHUB_WORKSPACE/.forgejo/signing/allowed_signers"
          git cat-file -e "${cutoff}^{commit}"
          git cat-file -e "${head_sha}^{commit}"
          git merge-base --is-ancestor "$cutoff" "$head_sha"
          git config gpg.format ssh
          git config gpg.ssh.program ssh-keygen
          git config gpg.ssh.allowedSignersFile "$allowed_signers"
          git config gpg.ssh.revocationFile "$GITHUB_WORKSPACE/.forgejo/signing/revoked_signers"
          verified=0
          while read -r commit; do
            [ -n "$commit" ] || continue
            git verify-commit "$commit"
            verified=$((verified + 1))
          done < <(git rev-list --reverse "${cutoff}..${head_sha}")
          echo "verified ${verified} post-rollout commit signature(s), trust chain ate 🔏🔥"

  release-policy:
    runs-on: linux
    steps:
      - name: yoink the release policy fixtures 📥🔥
        uses: https://data.forgejo.org/actions/checkout@v7
        with:
          fetch-depth: 0

      - name: reject unsupported Forgejo workflow cosplay 🚫🔥
        run: bash scripts/test-forgejo-workflows.sh

      - name: grab the newest checksum-verified git-cliff 2.x 🧗🔥
        uses: https://github.com/taiki-e/install-action@v2
        with:
          tool: git-cliff@2
          checksum: true
          fallback: none

      - name: prove the tool stayed on major 2 + verify strict SemVer 🧠🔥
        run: |
          set -euo pipefail
          cliff_version=$(git-cliff --version)
          if [[ ! "$cliff_version" =~ ^git-cliff[[:space:]]+2\. ]]; then
            echo "bruh install-action resolved '${cliff_version}', expected the newest stable 2.x 💀🔥"
            exit 1
          fi
          echo "${cliff_version} is the current major-2 release brain 🧠🔥"
          CLIFF="$(command -v git-cliff)" bash scripts/test-release-policy.sh

  build-and-test:
    runs-on: linux
    steps:
      - name: yoink the code 📥
        uses: https://data.forgejo.org/actions/checkout@v7

      - name: litty build the whole solution bestie 🏗️🔥
        run: dotnet run --project src/LittyLogs.Tool -- build --configuration Release

      - name: litty test — check all the vibes 🧪🔥
        run: dotnet run --project src/LittyLogs.Tool -- test --configuration Release --no-build

      - name: pack to verify nupkgs build clean 📦
        run: dotnet pack --configuration Release --no-build --output ./nupkgs

      - name: flex the artifacts 💅
        run: ls -la ./nupkgs/
